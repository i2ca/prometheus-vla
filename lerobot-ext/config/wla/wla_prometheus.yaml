run_id: wla_prometheus_copo
run_root_dir: /data/mrwlker/wla_treino
seed: 42
wandb_entity: prometheus-lcad
wandb_project: prometheus_g1
is_debug: false
framework:
  name: QwenMMDiT
  qwenvl:
    base_vlm: /data/mrwlker/UnifoLM-ER-1-Qwen3-VL
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 54
    state_dim: 60
    action_horizon: 30
    embodiment_types:
    - unitree
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
datasets:
  vla_data:
    dataset_py: multi_source_datasets
    data_config_path: unifolm_wla/dataloader/multi_source_dataset/configs/dados_prometheus.yaml
    per_device_batch_size: 24
    num_workers: 8
trainer:
  max_train_steps: 20000
  num_warmup_steps: 1000
  save_interval: 2000
  eval_interval: 500
  learning_rate:
    base: 0.0001
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
    omnivggt_fusion: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  logging_frequency: 10
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: safetensors
