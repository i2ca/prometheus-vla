[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-gpt6-astra-direct"
version = "0.1.0"
description = "GPT-6 Astra as a direct visuomotor policy for Unitree G1 in MuJoCo"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
astra-direct = "astra_direct.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

